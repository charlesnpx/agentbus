name: fail-closed

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26.0"
  CGO_ENABLED: "0"
  GOCACHE: ${{ runner.temp }}/go-cache
  GOMODCACHE: ${{ runner.temp }}/go-mod-cache

jobs:
  fail-closed:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS supported process-group custody
            runner: macos-15
            mode: darwin
          - name: Linux restricted process-group fallback
            runner: ubuntu-24.04
            mode: linux-restricted
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Custody platform gate
        run: scripts/ci/fail-closed.sh "${{ matrix.mode }}"
