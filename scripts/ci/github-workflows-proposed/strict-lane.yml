name: strict-lane

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_IMAGE: golang:1.26
  CGO_ENABLED: "0"

jobs:
  privileged-cgroup-v2:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'strict-lane')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Privileged cgroup-v2 gate
        run: scripts/ci/docker-cgroup-v2.sh
